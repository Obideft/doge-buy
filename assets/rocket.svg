<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 28" width="160" height="224" shape-rendering="crispEdges" role="img" aria-label="Pixel art rocket with a doge pilot flying to the moon">
  <!-- nose cone -->
  <rect x="8" y="0" width="4" height="1" fill="#c7351f"/>
  <rect x="7" y="1" width="6" height="2" fill="#e8402a"/>
  <rect x="6" y="3" width="8" height="3" fill="#fdf3e0"/>
  <!-- body -->
  <rect x="5" y="6" width="10" height="9" fill="#fdf3e0"/>
  <rect x="5" y="6" width="10" height="1" fill="#fffdf7"/>
  <!-- doge in window -->
  <rect x="7" y="7" width="6" height="5" fill="#f5b25a"/>
  <rect x="8" y="8" width="4" height="3" fill="#fdeccb"/>
  <rect x="9" y="8" width="1" height="1" fill="#14110e"/>
  <rect x="11" y="8" width="1" height="1" fill="#14110e"/>
  <rect x="10" y="9" width="1" height="1" fill="#14110e"/>
  <!-- fins -->
  <rect x="2" y="10" width="3" height="6" fill="#e8402a"/>
  <rect x="3" y="11" width="2" height="4" fill="#ff6b4a"/>
  <rect x="15" y="10" width="3" height="6" fill="#e8402a"/>
  <rect x="15" y="11" width="2" height="4" fill="#ff6b4a"/>
  <!-- thruster -->
  <rect x="6" y="15" width="8" height="2" fill="#c7351f"/>
  <!-- flame -->
  <rect x="7" y="17" width="6" height="3" fill="#ffd43b"/>
  <rect x="8" y="20" width="4" height="3" fill="#ff8a1e"/>
  <rect x="9" y="23" width="2" height="4" fill="#ffe98a"/>
</svg>
