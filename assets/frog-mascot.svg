<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="320" height="320" shape-rendering="crispEdges" role="img" aria-label="Pixel art frog mascot wearing a cap, sunglasses and an orange jacket">
  <!-- cap -->
  <rect x="7" y="0" width="18" height="2" fill="#3b1f0a"/>
  <rect x="8" y="1" width="16" height="2" fill="#f0782a"/>
  <rect x="4" y="3" width="24" height="2" fill="#3b1f0a"/>
  <rect x="5" y="3" width="22" height="2" fill="#e0621a"/>
  <!-- head -->
  <rect x="5" y="5" width="22" height="15" fill="#3b1f0a"/>
  <rect x="6" y="6" width="20" height="13" fill="#3fa637"/>
  <rect x="6" y="6" width="20" height="2" fill="#57c44b"/>
  <!-- eyes bulge -->
  <rect x="7" y="7" width="5" height="2" fill="#fdeccb"/>
  <rect x="20" y="7" width="5" height="2" fill="#fdeccb"/>
  <!-- sunglasses -->
  <rect x="6" y="10" width="20" height="2" fill="#14110e"/>
  <rect x="7" y="10" width="7" height="4" fill="#14110e"/>
  <rect x="18" y="10" width="7" height="4" fill="#14110e"/>
  <rect x="8" y="11" width="2" height="1" fill="#6f6a63"/>
  <rect x="19" y="11" width="2" height="1" fill="#6f6a63"/>
  <!-- mouth -->
  <rect x="10" y="16" width="12" height="1" fill="#1e6b1b"/>
  <rect x="12" y="17" width="8" height="1" fill="#1e6b1b"/>
  <!-- jacket -->
  <rect x="6" y="20" width="20" height="12" fill="#f0782a"/>
  <rect x="6" y="20" width="20" height="1" fill="#ffa055"/>
  <rect x="13" y="20" width="6" height="7" fill="#fdf3e0"/>
  <rect x="14" y="21" width="2" height="6" fill="#14110e"/>
  <rect x="2" y="22" width="4" height="10" fill="#3fa637"/>
  <rect x="26" y="22" width="4" height="10" fill="#3fa637"/>
</svg>
